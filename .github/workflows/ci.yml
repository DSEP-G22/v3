name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pytest packages -q
      - run: cd services/gateway && uv run python -m pytest tests -q
      - run: cd services/business && uv run python -m pytest tests -q && uv run python -m app.clock
      - run: cd services/inquiry && uv run python -m pytest tests -q
      - run: cd services/orchestrator && uv run python -m app.fusion
      - run: cd services/triage && uv run python -m pytest tests -q
      - run: cd services/translation && uv run python -m pytest tests -q
      - run: cd services/audio && uv run python -m app.confidence
      - run: cd services/image && uv run python -m app.led
      - run: cd services/business && uv run python -m app.fixtures ../grounding/tests/fixtures/prefetch.json
      - run: cd services/grounding && uv run python -m pytest tests -q
      - run: cd services/knowledge && uv run python -m app.diagnose
      - run: cd services/response && uv run python -m app.policy
      - run: uv run pytest tests/architecture -q

  auth:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/auth } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: No mock data in the web app
        run: "! grep -rEn 'faker|mockData|placeholderData' app components lib"
      - run: npm run build

  e2e:
    # The CI stack (no model images, offline stub LLM) on its own Postgres (compose.test.yaml):
    # no secret needed, and nothing it does (suspending an account, load) reaches production.
    runs-on: ubuntu-latest
    needs: [python, web]
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml:compose.test.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env
          docker compose up -d --build --wait || docker compose ps
      - uses: astral-sh/setup-uv@v6
      - run: |
          bash scripts/smoke.sh
          uv run --with httpx python scripts/verify_hot_swap.py
          uv run --with httpx python scripts/demo_flow.py
      - working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test
      - run: bash scripts/load.sh
      - if: failure()
        run: docker compose logs --no-color --tail 200

  gates:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The organisation's gitleaks licence is in GITLEAKS_LICENSE. Without it (a fork, say) the
      # CLI runs instead, which scans the same history and needs no licence.
      - name: gitleaks
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: gitleaks (no licence configured)
        if: env.GITLEAKS_LICENSE == ''
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
