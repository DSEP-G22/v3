name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per services/<svc>/Dockerfile; extended as each phase lands.
        svc: [migrate, auth, gateway, web, business, payments, inquiry, orchestrator, triage, translation, audio, image, grounding,
              knowledge, response, control]
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lanka-link-v3-${{ matrix.svc }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.svc == 'web' && 'web/Dockerfile' || format('services/{0}/Dockerfile', matrix.svc) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
          sbom: true
          provenance: mode=max
