# Monitoring: Prometheus, Grafana and the exporters that watch the host and every container.
# Production runs it (the deploy adds this file); locally:
#   docker compose -f compose.yaml -f compose.monitoring.yaml up -d
# Grafana is served by the edge at /grafana (admin, GRAFANA_ADMIN_PASSWORD). Nothing else here
# is reachable from outside the compose network.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    # The public probe's target (the deploy sets PUBLIC_PROBE_URL), which Prometheus cannot read from env.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        echo "- targets: ['${PUBLIC_PROBE_URL:-http://edge:8080/healthz}']" > /prometheus/public.yml &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d --storage.tsdb.retention.size=2GB --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Required: without it Grafana would start with admin/admin on a public URL.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lanka-link-vps.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    mem_limit: 256m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)"]
    pid: host
    volumes: ["/:/host:ro"]
    mem_limit: 64m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command: ["--docker_only=true", "--housekeeping_interval=15s", "--store_container_labels=false",
              "--disable_metrics=advtcp,cpu_topology,disk,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp"]
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./infra/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    mem_limit: 64m
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
