# Scraped every 15 s, kept 15 days (compose.monitoring.yaml). Nothing here is published outside
# the compose network; Grafana is the only way in.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # The VPS itself: CPU, memory, disk, network, load.
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"], labels: { instance: vps } }]

  # Every container: CPU, memory, network, restarts.
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]

  # The edge: requests, status codes and latency per route (Caddy's own metrics).
  - job_name: caddy
    static_configs: [{ targets: ["edge:8080"] }]

  # Each service's health endpoint from inside the network: up or down, and how long it took.
  - job_name: health
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://edge:8080/healthz
          - http://web:3000/
          - http://auth:3000/healthz
          - http://gateway:8000/api/health
          - http://business:8000/health
          - http://payments:8000/health
          - http://inquiry:8000/health
          - http://orchestrator:8000/health
          - http://control:8000/health
          - http://triage:8000/health
          - http://knowledge:8000/health
          - http://grounding:8000/health
          - http://response:8000/health
          - http://translation:8000/health
          - http://audio:8000/health
          - http://image:8000/health
          - http://nats:8222/healthz
    relabel_configs: &probe
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "https?://([^:/]+).*"
        target_label: service
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # The public URL the way a customer reaches it: DNS, TLS, the certificate's expiry, the edge.
  - job_name: public
    metrics_path: /probe
    params: { module: [http_2xx] }
    file_sd_configs: [{ files: [/prometheus/public.yml] }]
    relabel_configs: *probe
