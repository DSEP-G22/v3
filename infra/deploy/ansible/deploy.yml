# One Ubuntu host runs the whole compose stack. Ansible owns three things and nothing else:
# the Docker engine, the checkout at /opt/lanka-link, and the .env beside it. Every image is
# pulled from GHCR, so a deploy is a pull and an up, never a build.
#
#   ansible-playbook -i inventory.ini deploy.yml
#
# Secrets come from the environment (the GitHub Actions job exports them); nothing is stored here.
- name: Lanka Link v3
  hosts: lanka
  become: true
  vars:
    repo: "https://github.com/{{ github_owner }}/{{ github_repo | default('DSEP22') }}.git"
    branch: "{{ deploy_branch | default('main') }}"
    root: /opt/lanka-link
    compose: "docker compose -f compose.yaml -f compose.prod.yaml"

  tasks:
    - name: Docker engine and the compose plugin
      block:
        - apt: { update_cache: true, cache_valid_time: 3600 }
        - apt:
            name: [ca-certificates, curl, git, python3-docker]
            state: present
        - file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }
        - get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"
        - apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            filename: docker
        - apt:
            name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
            state: present
            update_cache: true
        - service: { name: docker, state: started, enabled: true }

    - name: The checkout the compose file needs (Caddyfile, NATS config, DAGs)
      git:
        repo: "{{ repo }}"
        dest: "{{ root }}"
        version: "{{ branch }}"
        force: true

    - name: The .env beside it, readable only by root
      template:
        src: env.j2
        dest: "{{ root }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Sign in to GHCR
      command: docker login ghcr.io -u {{ github_owner }} --password-stdin
      args: { stdin: "{{ ghcr_token }}" }
      no_log: true
      changed_when: false

    - name: Pull the new images
      command: "{{ compose }} pull --quiet"
      args: { chdir: "{{ root }}" }
      changed_when: true

    - name: Start, and wait for every health check
      command: "{{ compose }} up -d --wait --remove-orphans"
      args: { chdir: "{{ root }}" }
      register: up
      changed_when: true

    - name: The edge answers
      uri: { url: "https://{{ site_domain }}/healthz", return_content: true, validate_certs: true }
      register: health
      until: health.status == 200
      retries: 20
      delay: 10

    - name: Drop the images this release replaced
      command: docker image prune -af --filter "until=168h"
      changed_when: false

  handlers: []
