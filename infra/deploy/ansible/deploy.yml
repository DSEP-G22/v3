# One Ubuntu host runs the whole compose stack. Ansible owns three things and nothing else:
# the Docker engine, the checkout at /opt/lanka-link, and the .env beside it. Every image is
# pulled from GHCR, so a deploy is a pull and an up, never a build.
#
#   ansible-playbook -i inventory.ini deploy.yml -e github_owner=DSEP-G22 -e site_domain=... -e v3_tag=sha-abc1234
#
# Secrets come from environment variables (NEON_KEY, BETTER_AUTH_SECRET, ...: see templates/env.j2),
# which the GitHub Actions job exports; nothing secret is stored in this directory.
- name: Lanka Link v3
  hosts: lanka
  become: true
  vars:
    repo: "https://github.com/{{ github_owner }}/{{ github_repo | default('v3') }}.git"
    branch: "{{ deploy_branch | default('main') }}"
    root: /opt/lanka-link
    compose: "docker compose -f compose.yaml -f compose.prod.yaml"

  tasks:
    - name: Docker engine and the compose plugin
      block:
        - apt: { update_cache: true, cache_valid_time: 3600 }
        - apt:
            name: [ca-certificates, curl, git]
            state: present
        - file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }
        - get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"
        - apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            filename: docker
        - apt:
            name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
            state: present
            update_cache: true
        - service: { name: docker, state: started, enabled: true }

    - name: The checkout the compose file needs (Caddyfile, NATS config, DAGs)
      git:
        repo: "{{ repo }}"
        dest: "{{ root }}"
        version: "{{ branch }}"
        force: true
      register: checkout

    - name: The .env beside it, readable only by root
      template:
        src: env.j2
        dest: "{{ root }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Pull the new images
      command: "{{ compose }} pull --quiet"
      args: { chdir: "{{ root }}" }
      changed_when: true

    # Compose mounts the Caddyfile as a single file. Git replaces changed files rather than
    # editing them, and a running container keeps the file it started with, so the edge only
    # sees a new Caddyfile after a restart. Compose cannot tell: its own config did not change.
    - name: Restart the edge when the checkout changed its config
      command: "{{ compose }} restart edge"
      args: { chdir: "{{ root }}" }
      when: checkout.changed
      failed_when: false  # the first deploy has no edge yet

    - name: Start, and wait for every health check
      command: "{{ compose }} up -d --wait --remove-orphans"
      args: { chdir: "{{ root }}" }
      register: up
      changed_when: true

    - name: The edge answers
      uri: { url: "https://{{ site_domain }}/healthz", return_content: true, validate_certs: true }
      register: health
      until: health.status == 200
      retries: 20
      delay: 10

    - name: Drop the images this release replaced
      command: docker image prune -af --filter "until=168h"
      changed_when: false

  handlers: []
