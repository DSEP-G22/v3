  - model: ZY-VMG-3625
    vendor: Zyxel
    kind: gateway
    technologies: [adsl, vdsl]
    supports_wifi6: false
    lan_ports: 4
    latest_firmware: 2.11.4
    replacement_model: LL-ONT-2600
    known_issues:
      - Loses DSL sync on long copper runs when line attenuation exceeds 45 dB.
    led_semantics:
      - led: power
        colour: green
        behaviour: solid
        meaning: Powered and running normally.
        fault_id: null
      - led: power
        colour: red
        behaviour: solid
        meaning: Power supply fault.
        fault_id: fault_power_supply
      - led: dsl
        colour: green
        behaviour: blinking
        meaning: The copper line is trying to synchronise and has not settled.
        fault_id: fault_line_sync
      - led: dsl
        colour: "off"
        behaviour: "off"
        meaning: No DSL signal at all. Cabling fault or an exchange side problem.
        fault_id: fault_cabling
      - led: internet
        colour: amber
        behaviour: solid
        meaning: Sync is up but authentication failed, commonly a barred account.
        fault_id: fault_service_suspended
    port_layout:
      - port: POWER
        colour: black
        position: far left, round socket
        accepts: the power adapter lead
      - port: DSL
        colour: grey
        position: next to the power socket, small square socket
        accepts: the thin telephone style cable running to the wall socket
      - port: LAN1
        colour: yellow
        position: first of the four yellow sockets
        accepts: a network cable to a computer or TV box
      - port: LAN2
        colour: yellow
        position: second yellow socket
        accepts: a second network cable
      - port: LAN3
        colour: yellow
        position: third yellow socket
        accepts: a third network cable
      - port: LAN4
        colour: yellow
        position: fourth yellow socket
        accepts: a fourth network cable
    remedies:
      fault_cabling:
        steps:
          - Find the thin telephone style cable running from the wall socket to the router.
          - Push it firmly into the grey DSL socket, the small square socket next to the power lead, until it clicks.
          - Check the wall socket end is pushed in as well, and that the cable does not run through a splitter or an extension lead.
          - Wait two minutes, then look at the DSL light. Solid green means the line is back.
        escalate_if: The DSL light is still off after the cable has been pushed back in at both ends.
      fault_line_sync:
        steps:
          - Leave the router powered on and wait five minutes while the copper line settles.
          - If it is still blinking, unplug any telephone extension leads and splitters and connect the router straight to the wall socket.
        escalate_if: The DSL light is still blinking after the router has been connected directly to the wall socket.
      fault_power_supply:
        steps:
          - Check the power adapter is pushed firmly into the round black socket at the far left of the unit, and into the wall.
          - Try a different wall socket that you know works.
          - Switch the unit off at the wall for thirty seconds, then on again.
        escalate_if: The power light stays red or stays off after a second wall socket has been tried.
      fault_service_suspended:
        steps:
          - Nothing needs to be done to the router. The line itself is working, and the service comes back on its own once the account is settled.
        escalate_if: The internet light is still amber more than an hour after the balance was cleared.
  - model: HW-B535-232
    vendor: Huawei
    kind: dongle
    technologies: [lte]
    supports_wifi6: false
    lan_ports: 1
    latest_firmware: 11.0.1
    replacement_model: null
    known_issues: []
    led_semantics:
      - led: signal
        colour: green
        behaviour: solid
        meaning: Strong mobile signal.
        fault_id: null
      - led: signal
        colour: red
        behaviour: blinking
        meaning: No usable mobile signal at this location.
        fault_id: fault_no_coverage
      - led: power
        colour: red
        behaviour: solid
        meaning: Power supply fault.
        fault_id: fault_power_supply

    port_layout:
      - port: POWER
        colour: black
        position: far left, round socket
        accepts: the power adapter lead
      - port: LAN
        colour: yellow
        position: single yellow socket
        accepts: a network cable to a computer or TV box
      - port: SIM
        colour: black
        position: under the back cover
        accepts: the SIM card, gold contacts facing down
    remedies:
      fault_no_coverage:
        steps:
          - Move the unit next to a window, or to the highest floor of the building. The signal is much weaker inside thick walls.
          - Leave it in the new position for two minutes and watch the signal light.
          - If it is still red, switch the unit off for thirty seconds and on again so it searches for the network from scratch.
        escalate_if: The signal light stays red after the unit has been moved next to a window and restarted.
      fault_power_supply:
        steps:
          - Check the power adapter is pushed firmly into the round black socket at the far left of the unit, and into the wall.
          - Try a different wall socket that you know works.
          - Switch the unit off at the wall for thirty seconds, then on again.
        escalate_if: The power light stays red or stays off after a second wall socket has been tried.
known_issues:
  - id: KI-2026-004
    title: LL-ONT-2400 reboot loop on firmware 4.1.2
    applies_to_models: [LL-ONT-2400]
    applies_to_faults: [fault_firmware_crashloop]
    symptom: The power light blinks red and the unit restarts every few minutes under upload load.
    workaround: Push firmware 4.2.7, which corrects the watchdog timeout.
    permanent_fix: Firmware 4.2.7, released in March 2026.
    open_since: 2026-01-14
    resolved_on: 2026-03-02
  - id: KI-2026-011
    title: Evening congestion on OLT-CMB-03 uplink
    applies_to_models: []
    applies_to_faults: [fault_intermittent_connection]
    symptom: Throughput falls sharply between 8 pm and 11 pm for subscribers on the Colombo Central OLT.
    workaround: Confirm the uplink utilisation figure before dispatching an engineer, because the line itself is healthy.
    permanent_fix: Uplink capacity upgrade scheduled for the second quarter.
    open_since: 2026-06-19
    resolved_on: null
