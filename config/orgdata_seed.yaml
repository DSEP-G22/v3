device_models:
  - model: LL-ONT-2400
    vendor: Lanka Link
    kind: ont
    technologies: [gpon]
    supports_wifi6: true
    lan_ports: 4
    latest_firmware: 4.2.7
    replacement_model: LL-ONT-2600
    known_issues:
      - Firmware 4.1.2 reboots under sustained upload above 300 Mbps.
    led_semantics:
      - led: power
        colour: green
        behaviour: solid
        meaning: Powered and running normally.
        fault_id: null
      - led: power
        colour: red
        behaviour: solid
        meaning: Power supply fault. The unit is receiving no usable power.
        fault_id: fault_power_supply
      - led: power
        colour: red
        behaviour: blinking
        meaning: The unit is restarting repeatedly, which points at a firmware crash loop.
        fault_id: fault_firmware_crashloop
      - led: pon
        colour: green
        behaviour: solid
        meaning: Fibre is connected and the line has synchronised.
        fault_id: null
      - led: pon
        colour: "off"
        behaviour: "off"
        meaning: No optical signal reaching the unit. Fibre is cut, unplugged, or the OLT is down.
        fault_id: fault_cabling
      - led: pon
        colour: green
        behaviour: blinking
        meaning: The line is still synchronising. Normal for up to two minutes after a restart.
        fault_id: fault_line_sync
      - led: internet
        colour: amber
        behaviour: solid
        meaning: The line is up but the service is not authenticated, which usually means the account is barred.
        fault_id: fault_service_suspended
      - led: internet
        colour: "off"
        behaviour: "off"
        meaning: No internet service on an otherwise live line.
        fault_id: fault_no_dial_tone
    port_layout:
      - port: POWER
        colour: black
        position: far left, round socket
        accepts: the power adapter lead
      - port: PON
        colour: green
        position: left of the yellow sockets, small round socket with a dust cap
        accepts: the thin fibre lead coming from the small box on the wall
      - port: LAN1
        colour: yellow
        position: first of the four yellow sockets
        accepts: a network cable to a computer, TV box or WiFi extender
      - port: LAN2
        colour: yellow
        position: second yellow socket
        accepts: a second network cable
      - port: LAN3
        colour: yellow
        position: third yellow socket
        accepts: a third network cable
      - port: LAN4
        colour: yellow
        position: fourth yellow socket
        accepts: a fourth network cable
      - port: TEL
        colour: grey
        position: far right
        accepts: a telephone handset cable
    remedies:
      fault_cabling:
        steps:
          - Find the thin fibre lead that runs from the small box on the wall to the router.
          - Check both ends are pushed in fully until they click. The router end is the green PON socket, the small round socket to the left of the four yellow ones.
          - If the lead has come out, line the connector up with the notch facing up and press it in gently. Never force it, and never bend the fibre tightly, because it breaks.
          - Wait two minutes, then look at the PON light. Solid green means the line is back.
        escalate_if: The PON light is still off after the lead has been pushed back in at both ends, or the fibre lead looks kinked, crushed or has a broken connector.
      fault_power_supply:
        steps:
          - Check the power adapter is pushed firmly into the round black socket at the far left of the unit, and into the wall.
          - Try a different wall socket that you know works.
          - Switch the unit off at the wall for thirty seconds, then on again.
        escalate_if: The power light stays red or stays off after a second wall socket has been tried.
      fault_firmware_crashloop:
        steps:
          - Leave the unit powered on and connected. The firmware correction is sent to it remotely and it will restart on its own.
        escalate_if: The unit is still restarting after the firmware update has been applied.
      fault_line_sync:
        steps:
          - Leave the unit powered on and wait two minutes while the line settles.
        escalate_if: The PON light is still blinking after five minutes.
      fault_service_suspended:
        steps:
          - Nothing needs to be done to the router. The line itself is working, and the service comes back on its own once the account is settled.
        escalate_if: The internet light is still amber more than an hour after the balance was cleared.
      fault_no_dial_tone:
        steps:
          - Switch the unit off at the wall for thirty seconds, then on again, and wait two minutes.
        escalate_if: The internet light is still off after the restart.
