[project]
name = "lanka-link-v3"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# Listed explicitly: services/auth is TypeScript and has no pyproject.
members = [
  "packages/common",
  "services/migrate",
  "services/gateway",
  "services/business",
  "services/payments",
  "services/inquiry",
  "services/orchestrator",
  "services/triage",
  "services/translation",
  "services/audio",
  "services/image",
  "services/grounding",
  "services/knowledge",
  "services/response",
  "services/control",
]

[tool.uv.sources]
lanka-common = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "lanka-common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I"]

[tool.ruff.lint.isort]
known-first-party = ["lanka_common", "app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
